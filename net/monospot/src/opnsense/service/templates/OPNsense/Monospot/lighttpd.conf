{% if helpers.exists('OPNsense.Monospot.general.portal_port') %}
{%   set portal_port = OPNsense.Monospot.general.portal_port %}
{% else %}
{%   set portal_port = '8100' %}
{% endif %}
#
# Monospot portal lighttpd yapılandırması (otomatik üretilir).
#
# Core captive portal zone lighttpd'si statiktir (PHP çalıştırmaz) ve core WebGUI
# portu yetkisiz istemciye açılamaz; bu yüzden portal kendi lighttpd örneğinde
# kendi portunda sunulur. Erişim yalnızca zone arayüzlerine açılan geçiş
# kuralıyla (plugins.inc.d/monospot.inc) verilir.
#
server.modules = ( "mod_access", "mod_expire", "mod_deflate", "mod_redirect",
                   "mod_setenv", "mod_cgi", "mod_fastcgi", "mod_alias", "mod_rewrite",
                   "mod_accesslog" )

server.username = "www"
server.groupname = "www"

server.document-root = "/usr/local/opnsense/scripts/monospot/app"
server.indexfiles    = ( "captiveportal.php" )
server.bind          = "0.0.0.0"
server.port          = {{ portal_port }}

server.pid-file = "/var/run/monospot-lighttpd.pid"
server.errorlog = "/var/log/monospot-error.log"
accesslog.filename = "/var/log/monospot-access.log"

server.max-keep-alive-requests = 15
server.max-keep-alive-idle = 30
server.max-write-idle = 999
server.max-request-size = 65536
server.upload-dirs = ( "/var/lib/php/tmp" )

# uygulama iç dosyaları ve yönetim yüzeyi portal portundan sunulmaz
url.access-deny = ( "~", ".inc", ".ini", ".db", ".sqlite", ".sample.php", ".md" )
$HTTP["url"] =~ "^/(index\.php|update\.php|views|lib|models|sms|db|lang)(/|$)" {
    url.access-deny = ( "" )
}

debug.log-request-header   = "disable"
debug.log-response-header  = "disable"
debug.log-request-handling = "disable"
debug.log-file-not-found   = "disable"

#### fastcgi module: portal PHP'si, core'dan bağımsız soket ve oturum dizini
fastcgi.server = ( ".php" =>
    ( "localhost" =>
        (
            "socket" => "/var/run/monospot/php-fastcgi.socket",
            "max-procs" => 4,
            "bin-environment" => (
                "PHP_FCGI_CHILDREN" => "2",
                "PHP_FCGI_MAX_REQUESTS" => "500"
            ),
            "bin-path" => "/usr/local/bin/php-cgi"
        )
    )
)
