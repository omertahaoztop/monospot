[start]
command:/usr/local/etc/rc.d/monospot start
parameters:
type:script
message:starting monospot portal
description:Start Monospot portal

[stop]
command:/usr/local/etc/rc.d/monospot stop
parameters:
type:script
message:stopping monospot portal
description:Stop Monospot portal

[restart]
command:/usr/local/etc/rc.d/monospot restart
parameters:
type:script
message:restarting monospot portal
description:Restart Monospot portal

[status]
command:/usr/local/etc/rc.d/monospot status || exit 0
parameters:
type:script_output
message:requesting monospot portal status
description:Monospot portal status

[configtest]
command:/usr/local/sbin/lighttpd -tt -f /var/etc/lighttpd-monospot.conf 2>&1 || exit 0
parameters:
type:script_output
message:testing monospot lighttpd configuration

[install_zonetemplate]
command:/usr/local/opnsense/scripts/monospot/install_zonetemplate.sh
parameters:--zoneid=%s --port=%s --name=%s
type:script_output
message:installing monospot zone template for zone %s
description:Install the captive portal zone template which redirects clients to the Monospot portal

[collect5651]
command:/usr/local/opnsense/scripts/monospot/collect5651.py
parameters:
type:script_output
message:collecting the daily Monospot 5651 archive
description:Collect the daily 5651 archive (portal identity log, DHCP leases, captive portal sessions)

[info]
command:/usr/local/opnsense/scripts/monospot/status.php
parameters:
type:script_output
message:collecting monospot status
description:Monospot status summary (service, zone, clients, database, 5651 archive, SMS)

[set_captiveportal]
command:/usr/local/opnsense/scripts/monospot/set_captiveportal.php
parameters:--interfaces=%s --idletimeout=%s --hardtimeout=%s --concurrentlogins=%s --roaming=%s --enabled=%s --description=%s
type:script_output
message:writing captive portal zone settings for zone %s
description:Write captive portal zone settings (interfaces, timeouts, roaming, description) to the core model

[user_admin]
command:/usr/local/opnsense/scripts/monospot/user_admin.php
parameters:%s
type:script_output
message:monospot user administration
description:Monospot user administration over the hotspot database (list/get/save/delete)

[group_admin]
command:/usr/local/opnsense/scripts/monospot/group_admin.php
parameters:%s
type:script_output
message:monospot group administration
description:Monospot group administration over the hotspot database (list/get/save/delete)

[report_admin]
command:/usr/local/opnsense/scripts/monospot/report_admin.php
parameters:%s
type:script_output
message:monospot report
description:Monospot reports from the hotspot database (sms / permission lists)

[session_admin]
command:/usr/local/opnsense/scripts/monospot/session_admin.php
parameters:%s
type:script_output
message:monospot session administration
description:Monospot authorized session list and disconnect over the core captive portal

[group_settings_admin]
command:/usr/local/opnsense/scripts/monospot/group_settings_admin.php
parameters:%s
type:script_output
message:monospot group portal settings
description:Monospot group portal settings (settings_group<id>.inc get and set)

[lang_admin]
command:/usr/local/opnsense/scripts/monospot/lang_admin.php
parameters:%s
type:script_output
message:monospot language files
description:Monospot portal language files (app/lang/<code>.inc get and set)

[portal_settings]
command:/usr/local/opnsense/scripts/monospot/portal_settings.php
parameters:%s
type:script_output
message:monospot portal application settings
description:Monospot portal application settings (settings.inc / hotspot.ini get and set)
